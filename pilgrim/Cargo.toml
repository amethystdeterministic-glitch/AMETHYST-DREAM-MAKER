[package]
name = "pilgrim"
version = "1.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

odin_core = { path = "../core" }
odin_subsystem = { path = "../subsystem" }
