[package]
name = "odin_core"
version = "0.2.0"
edition = "2024"

[lib]
name = "odin_core"
path = "src/lib.rs"

[[bin]]
name = "odin_core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
