<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AETHER</title>

<style>

/* --------------------
PRISM FOUNDATION
-------------------- */

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: #eae6f2;

  background:
    radial-gradient(circle at top, #2a1f3d, #000 70%);
}

/* --------------------
CONTAINER
-------------------- */

.container {
  display: flex;
  width: 300vw;
  height: calc(100vh - 70px);
  transition: transform 0.3s ease;
}

.page {
  width: 100vw;
  padding: 16px;
  box-sizing: border-box;
}

/* --------------------
TYPOGRAPHY
-------------------- */

h2 {
  text-align: center;
  letter-spacing: 2px;
  font-weight: 500;
  margin-bottom: 20px;
}

/* --------------------
PRISM CARDS
-------------------- */

.card {
  background: linear-gradient(145deg, #1a1426, #0d0a14);
  margin: 12px 0;
  padding: 16px;
  border-radius: 14px;

  border: 1px solid rgba(255,255,255,0.05);

  box-shadow:
    0 0 10px rgba(160, 120, 255, 0.08),
    inset 0 0 10px rgba(255,255,255,0.02);
}

/* --------------------
BUTTONS (CONTROLLED LIGHT)
-------------------- */

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;

  border-radius: 10px;
  border: none;

  background: linear-gradient(90deg, #5a3bd1, #7b5cff);
  color: white;

  font-weight: 500;
}

button:active {
  opacity: 0.85;
}

/* --------------------
STATUS
-------------------- */

.status {
  font-size: 12px;
  margin-top: 6px;
}

.green { color: #8affc1; }
.red { color: #ff6b6b; }

/* --------------------
NAVBAR (OS-LIKE)
-------------------- */

.navbar {
  height: 70px;
  display: flex;

  background: rgba(10, 10, 20, 0.9);
  backdrop-filter: blur(10px);

  border-top: 1px solid rgba(255,255,255,0.05);
}

.navbtn {
  flex: 1;
  text-align: center;
  padding-top: 12px;
  font-size: 11px;
  color: #aaa;
}

.navbtn.active {
  color: #c5aaff;
}

.navbtn:active {
  background: rgba(255,255,255,0.05);
}

pre {
  font-size: 12px;
  white-space: pre-wrap;
}

/* --------------------
PRISM GLOW LINE
-------------------- */

.header {
  height: 4px;
  background: linear-gradient(90deg, #5a3bd1, #9c7bff);
  margin-bottom: 10px;
  border-radius: 2px;
}

</style>
</head>

<body>

<div class="header"></div>

<div id="container" class="container">

  <!-- SYSTEM -->
  <div class="page">
    <h2>AETHER SYSTEM</h2>

    <div class="card">
      <div>DQI Runtime</div>
      <div id="dqi_status" class="status">checking...</div>
      <button onclick="sendSignal('generate new engine idea')">
        Creative
      </button>
    </div>

    <div class="card">
      <div>Research</div>
      <button onclick="sendSignal('run breast cancer phase 2')">
        Cancer Phase 2
      </button>
    </div>

    <div class="card">
      <div>Fraud</div>
      <button onclick="sendSignal('find NHS fraud anomalies')">
        Fraud Scan
      </button>
    </div>
  </div>

  <!-- APPS -->
  <div class="page">
    <h2>AETHER APPS</h2>
    <div id="apps"></div>
  </div>

  <!-- DQI -->
  <div class="page">
    <h2>DQI LIVE</h2>
    <div class="card">
      <pre id="dqi_output">Loading...</pre>
    </div>
  </div>

</div>

<!-- NAV -->
<div class="navbar">
  <div class="navbtn active" onclick="go(0, this)">SYSTEM</div>
  <div class="navbtn" onclick="go(1, this)">APPS</div>
  <div class="navbtn" onclick="go(2, this)">DQI</div>
</div>

<script>

// NAV
let current = 0;
const container = document.getElementById('container');

function go(index, el) {
  current = index;
  container.style.transform = `translateX(-${index * 100}vw)`;

  document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

// APPS
async function loadApps() {
  const res = await fetch('/aether_registry.json');
  const apps = await res.json();

  const container = document.getElementById('apps');

  apps.forEach(app => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerText = app.name;

    el.onclick = () => {
      window.location.href = app.url;
    };

    container.appendChild(el);
  });
}

// SIGNAL
function sendSignal(text) {
  fetch('/dqi_signal', { method: 'POST', body: text });
}

// STATUS
async function checkDQI() {
  try {
    const res = await fetch('/dqi_log');
    document.getElementById('dqi_status').innerHTML =
      '<span class="green">ACTIVE</span>';
  } catch {
    document.getElementById('dqi_status').innerHTML =
      '<span class="red">OFFLINE</span>';
  }
}

// LOG
async function loadDQI() {
  try {
    const res = await fetch('/dqi_log');
    const text = await res.text();
    document.getElementById('dqi_output').innerText =
      text.split('\n').slice(-20).join('\n');
  } catch {
    document.getElementById('dqi_output').innerText = "DQI offline";
  }
}

setInterval(loadDQI, 2000);
setInterval(checkDQI, 3000);

loadApps();
loadDQI();
checkDQI();

</script>

</body>
</html>
